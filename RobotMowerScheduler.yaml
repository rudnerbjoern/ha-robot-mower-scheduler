      - conditions:
          - condition: template
            value_template: >
              {% set e = night_light_switch_entity | string | trim %}
              {{ e | length > 0 and not is_state(e, 'on') }}
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ night_light_switch_entity }}"
            continue_on_error: true
  - alias: "Ensure rain detection during mow is on before Zone A"
    choose:
      - conditions:
          - condition: template
            value_template: >
              {% set e = rain_detection_during_mow_switch_entity | string | trim %}
              {{ e | length > 0 and not is_state(e, 'on') }}
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ rain_detection_during_mow_switch_entity }}"
            continue_on_error: true
  - alias: "Ensure mower rain detection is on before Zone A"
    choose:
      - conditions:
          - condition: template
            value_template: >
              {% set e = rain_detection_mower_switch_entity | string | trim %}
              {{ e | length > 0 and not is_state(e, 'on') }}
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ rain_detection_mower_switch_entity }}"
            continue_on_error: true
  - alias: "Start mowing Zone A"
    service: lawn_mower.start_mowing
    target:
      entity_id: !input mower_entity

  - alias: "One-time pause recovery after Zone A start"
    choose:
      - conditions:
          - condition: template
            value_template: "{{ post_start_pause_resume_window | int > 0 }}"
        sequence:
          - wait_for_trigger:
              - platform: state
                entity_id: !input mower_entity
                to: "paused"
                id: post_start_paused
              - platform: state
                entity_id: !input weather_entity
                to:
                  - "rainy"
                  - "pouring"
                  - "lightning-rainy"
                  - "hail"
                  - "snowy-rainy"
                  - "exceptional"
                id: rain
            timeout:
              seconds: "{{ post_start_pause_resume_window | int }}"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.trigger is not none and wait.trigger.id == 'post_start_paused' }}"
                sequence:
                  - service: lawn_mower.start_mowing
                    target:
                      entity_id: !input mower_entity
                    continue_on_error: true
                  - service: notify.persistent_notification
                    data:
                      title: "▶️ {{ mower_display_name }} fortgesetzt — Zone A"
                      message: >
                        Der Mäher hat kurz nach dem Start von {{ zone_a_name }} pausiert.
                        Ein einmaliger Fortsetzen-Befehl wurde gesendet.
              - conditions:
                  - condition: template
                    value_template: "{{ wait.trigger is not none and wait.trigger.id == 'rain' }}"
                sequence:
                  - service: lawn_mower.dock
                    target:
                      entity_id: !input mower_entity
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: !input rain_last_seen
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  - service: notify.persistent_notification
                    data:
                      title: "🌧️ {{ mower_display_name }} während Zone-A-Start zurückgerufen"
                      message: >
                        Während des Starts von {{ zone_a_name }} wurde Regen erkannt.
                        Der Mäher wurde zur Ladestation geschickt und der Zonenzähler wurde nicht weitergesetzt.
                  - stop: "Regen während des Start-/Wiederaufnahmefensters erkannt"

  - alias: "Wait for Zone A to complete, timeout, or rain to interrupt"
    wait_for_trigger:
      - platform: state
        entity_id: !input weather_entity
        to:
          - "rainy"
          - "pouring"
          - "lightning-rainy"
          - "hail"
          - "snowy-rainy"
          - "exceptional"
        id: rain
      - platform: template
        id: complete
        value_template: >
          {% set progress_entity = mower_progress_sensor | string | trim %}
          {% set time_left_entity = mower_time_left_sensor | string | trim %}
          {% set task_entity = mower_task_status_sensor | string | trim %}
          {% set activity_entity = mower_activity_mode_sensor | string | trim %}
          {% set progress = states(progress_entity) | float(-1) if progress_entity | length > 0 else -1 %}
          {% set time_left = states(time_left_entity) | float(999) if time_left_entity | length > 0 else 999 %}
          {% set task = states(task_entity) | upper if task_entity | length > 0 else '' %}
          {% set activity = states(activity_entity) | upper if activity_entity | length > 0 else '' %}
          {% set mower = states(mower_entity) | lower %}
          {{
            task == 'COMPLETE'
            or (
              time_left <= 0
              and progress >= 99
              and activity not in ['MODE_WORKING', 'MODE_MOWING']
            )
            or (
              mower in ['docked', 'idle']
              and progress >= 99
              and time_left <= 0
            )
          }}
    timeout:
      minutes: "{{ zone_duration | int }}"
    continue_on_timeout: true

  - alias: "Three-minute grace period after Zone A completion signal"
    choose:
      - conditions:
          - condition: template
            value_template: "{{ wait.trigger is not none and wait.trigger.id == 'complete' }}"
        sequence:
          - delay:
              minutes: 3

  - alias: "Return mower to dock after Zone A"
    service: lawn_mower.dock
    target:
      entity_id: !input mower_entity

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ wait.trigger is none or wait.trigger.id == 'complete' }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: !input zone_tracker
            data:
              value: "{{ zone_a | int }}"
          - service: input_datetime.set_datetime
            target:
              entity_id: !input last_run_tracker
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - service: notify.persistent_notification
            data:
              title: "✅ {{ mower_display_name }} abgeschlossen — {{ zone_a_name }}"
              message: >
                Zone {{ zone_a }} ({{ zone_a_name }}) wurde abgeschlossen.
                Zonenzähler wurde auf {{ zone_a }} weitergesetzt.
      - conditions:
          - condition: template
            value_template: "{{ wait.trigger is not none and wait.trigger.id == 'rain' }}"
        sequence:
          - service: input_datetime.set_datetime
            target:
              entity_id: !input rain_last_seen
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - service: notify.persistent_notification
            data:
              title: "🌧️ {{ mower_display_name }} während des Mähens zurückgerufen — Zone A"
              message: >
                Während des Mähens von {{ zone_a_name }} wurde Regen erkannt. Der Mäher wurde zur Ladestation geschickt.
                Zonenzähler bleibt bei {{ current_zone }}.
                Trocknungszeit nach Regen: {{ wet_lawn_dry_out_delay_hours }} Stunden.

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ effective_zones_per_session | int >= 2 }}"
        sequence:
          - alias: "Rest period between Zone A and Zone B"
            delay:
              minutes: "{{ inter_zone_rest | int }}"

          - choose:
              - conditions:
                  - condition: template
                    alias: "Skip Zone B if garden is currently in use"
                    value_template: >
                      {% set e = garden_in_use_toggle | string | trim %}
                      {{ e | length > 0 and is_state(e, 'on') }}
                sequence:
                  - service: notify.persistent_notification
                    data:
                      title: "🏡 {{ mower_display_name }} Zone B übersprungen — Garten wird genutzt"
                      message: >
                        Zone B wurde vor dem Start von {{ zone_b_name }} übersprungen,
                        weil der Sperrschalter "Garten wird genutzt" aktiv ist.

                        Der Zonenzähler bleibt bei {{ zone_a }}.
                  - stop: "Garten wird genutzt — Zone B übersprungen"

          - choose:
              - conditions:
                  - condition: template
                    alias: "Skip Zone B if rain is detected before start"
                    value_template: >
                      {{ states(weather_entity) in ['rainy', 'pouring', 'lightning-rainy', 'hail', 'snowy-rainy', 'exceptional'] }}
                sequence:
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: !input rain_last_seen
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  - service: notify.persistent_notification
                    data:
                      title: "🌧️ {{ mower_display_name }} Zone B übersprungen — Regen"
                      message: >
                        Vor Zone B wurde Regen erkannt. {{ zone_b_name }} wird übersprungen.
                        Wettervorhersage: {{ states(weather_entity) }}.
                        Zonenzähler bleibt bei {{ zone_a }}.
                        Trocknungszeit nach Regen: {{ wet_lawn_dry_out_delay_hours }} Stunden.
                  - stop: "Regen vor Zone B erkannt"

          - choose:
              - conditions:
                  - condition: template
                    alias: "Skip Zone B if current temperature is too high before start"
                    value_template: >
                      {% set temp_entity = temperature_sensor | string | trim %}
                      {% if temp_entity | length == 0 %}
                        false
                      {% else %}
                        {% set temp = states(temp_entity) | float(none) %}
                        {{ temp is none or temp >= (max_start_temperature | float) }}
                      {% endif %}
                sequence:
                  - service: notify.persistent_notification
                    data:
                      title: "🌡️ {{ mower_display_name }} Zone B übersprungen — Temperatur"
                      message: >
                        Zone B wurde vor dem Start von {{ zone_b_name }} übersprungen.

                        Aktuelle Temperatur:
                        {{ states(temperature_sensor) if temperature_sensor | string | trim | length > 0 else 'nicht konfiguriert' }} °C.

                        Der Mähvorgang startet nur unterhalb von {{ max_start_temperature }} °C.
                        Zonenzähler bleibt bei {{ zone_a }}.
                  - stop: "Temperatur vor Zone B zu hoch oder nicht verfügbar"

          - choose:
              - conditions:
                  - condition: template
                    alias: "Skip Zone B if battery level is too low before start"
                    value_template: >
                      {% set battery_entity = mower_battery_level_sensor | string | trim %}
                      {% if battery_entity | length == 0 %}
                        false
                      {% else %}
                        {% set battery = states(battery_entity) | float(none) %}
                        {{ battery is none or battery < (minimum_battery_before_start | float) }}
                      {% endif %}
                sequence:
                  - service: notify.persistent_notification
                    data:
                      title: "🔋 {{ mower_display_name }} Zone B übersprungen — Akkustand"
                      message: >
                        Zone B wurde vor dem Start von {{ zone_b_name }} übersprungen.

                        Aktueller Akkustand:
                        {{ states(mower_battery_level_sensor) if mower_battery_level_sensor | string | trim | length > 0 else 'nicht konfiguriert' }} %.

                        Erforderlich sind mindestens {{ minimum_battery_before_start }} %.
                        Zonenzähler bleibt bei {{ zone_a }}.
                  - stop: "Akkustand vor Zone B zu niedrig oder nicht verfügbar"

          - choose:
              - conditions:
                  - condition: template
                    alias: "Skip Zone B if mower state is not allowed before start"
                    value_template: >
                      {% set allowed = allowed_mower_states_before_start if allowed_mower_states_before_start is iterable and allowed_mower_states_before_start is not string else [] %}
                      {% set mower_state = states(mower_entity) | lower %}
                      {{
                        mower_start_state_check_enabled | bool
                        and (allowed | list | count > 0)
                        and mower_state not in allowed
                      }}
                sequence:
                  - service: notify.persistent_notification
                    data:
                      title: "🤖 {{ mower_display_name }} Zone B übersprungen — Mäherstatus"
                      message: >
                        Zone B wurde vor dem Start von {{ zone_b_name }} übersprungen.

                        Aktueller Mäherstatus: {{ states(mower_entity) }}.
                        Erlaubte Statuswerte vor dem Start:
                        {{ allowed_mower_states_before_start | join(', ') }}.

                        Zonenzähler bleibt bei {{ zone_a }}.
                  - stop: "Mäherstatus vor Zone B nicht erlaubt"

          - choose:
              - conditions:
                  - condition: template
                    alias: "Still clear to mow Zone B"
                    value_template: "true"
                sequence:
                  - alias: "Turn off all active area switches before Zone B"
                    service: switch.turn_off
                    target:
                      entity_id: >
                        {{ [sw1, sw2, sw3, sw4, sw5, sw6][:zone_mod | int(6)] | reject('eq', '') | list }}
                  - delay:
                      seconds: 6
                  - alias: "Enable only Zone B switch"
                    service: switch.turn_on
                    target:
                      entity_id: "{{ zone_b_switch }}"
                  - delay:
                      seconds: 9
                  # ── Apply Mammotion integration settings before Zone B only if needed ────────────
                  - alias: "Set blade height before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = blade_height_number_entity | string | trim %}
                              {% set current = states(e) | float(none) if e | length > 0 else none %}
                              {% set temp_entity = temperature_sensor | string | trim %}
                              {% set temp = states(temp_entity) | float(none) if temp_entity | length > 0 else none %}
                              {% if hot_weather_blade_height_enabled | bool and temp is not none and temp >= (hot_weather_blade_height_temperature | float) %}
                                {% set desired = mammotion_hot_weather_blade_height | float %}
                              {% else %}
                                {% set desired = mammotion_blade_height | float %}
                              {% endif %}
                              {{ e | length > 0 and (current is none or (current - desired) | abs > 0.001) }}
                        sequence:
                          - service: number.set_value
                            target:
                              entity_id: "{{ blade_height_number_entity }}"
                            data:
                              value: >
                                {% set temp_entity = temperature_sensor | string | trim %}
                                {% set temp = states(temp_entity) | float(none) if temp_entity | length > 0 else none %}
                                {% if hot_weather_blade_height_enabled | bool and temp is not none and temp >= (hot_weather_blade_height_temperature | float) %}
                                  {{ mammotion_hot_weather_blade_height | int }}
                                {% else %}
                                  {{ mammotion_blade_height | int }}
                                {% endif %}
                            continue_on_error: true
                  - alias: "Set working speed before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = working_speed_number_entity | string | trim %}
                              {% set current = states(e) | float(none) if e | length > 0 else none %}
                              {% set desired = mammotion_working_speed | float %}
                              {{ e | length > 0 and (current is none or (current - desired) | abs > 0.001) }}
                        sequence:
                          - service: number.set_value
                            target:
                              entity_id: "{{ working_speed_number_entity }}"
                            data:
                              value: "{{ mammotion_working_speed | float }}"
                            continue_on_error: true
                  - alias: "Set cutting path angle before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = cutting_path_angle_number_entity | string | trim %}
                              {% set current = states(e) | float(none) if e | length > 0 else none %}
                              {% set desired = mammotion_cutting_path_angle | float %}
                              {{ e | length > 0 and (current is none or (current - desired) | abs > 0.001) }}
                        sequence:
                          - service: number.set_value
                            target:
                              entity_id: "{{ cutting_path_angle_number_entity }}"
                            data:
                              value: "{{ mammotion_cutting_path_angle | int }}"
                            continue_on_error: true
                  - alias: "Set crossing angle before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = crossing_angle_number_entity | string | trim %}
                              {% set current = states(e) | float(none) if e | length > 0 else none %}
                              {% set desired = mammotion_crossing_angle | float %}
                              {{ e | length > 0 and (current is none or (current - desired) | abs > 0.001) }}
                        sequence:
                          - service: number.set_value
                            target:
                              entity_id: "{{ crossing_angle_number_entity }}"
                            data:
                              value: "{{ mammotion_crossing_angle | int }}"
                            continue_on_error: true
                  - alias: "Set path spacing before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = path_spacing_number_entity | string | trim %}
                              {% set current = states(e) | float(none) if e | length > 0 else none %}
                              {% set desired = mammotion_path_spacing | float %}
                              {{ e | length > 0 and (current is none or (current - desired) | abs > 0.001) }}
                        sequence:
                          - service: number.set_value
                            target:
                              entity_id: "{{ path_spacing_number_entity }}"
                            data:
                              value: "{{ mammotion_path_spacing | int }}"
                            continue_on_error: true
                  - alias: "Set start progress before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = start_progress_number_entity | string | trim %}
                              {% set current = states(e) | float(none) if e | length > 0 else none %}
                              {% set desired = mammotion_start_progress | float %}
                              {{ e | length > 0 and (current is none or (current - desired) | abs > 0.001) }}
                        sequence:
                          - service: number.set_value
                            target:
                              entity_id: "{{ start_progress_number_entity }}"
                            data:
                              value: "{{ mammotion_start_progress | int }}"
                            continue_on_error: true
                  - alias: "Set cutter speed before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = cutter_speed_select_entity | string | trim %}
                              {% set desired = cutter_speed_option | string %}
                              {{ e | length > 0 and states(e) | string != desired }}
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: "{{ cutter_speed_select_entity }}"
                            data:
                              option: "{{ cutter_speed_option }}"
                            continue_on_error: true
                  - alias: "Set cutting path mode before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = cutting_path_mode_select_entity | string | trim %}
                              {% set desired = cutting_path_mode_option | string %}
                              {{ e | length > 0 and states(e) | string != desired }}
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: "{{ cutting_path_mode_select_entity }}"
                            data:
                              option: "{{ cutting_path_mode_option }}"
                            continue_on_error: true
                  - alias: "Set cutting path angle mode before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = cutting_path_angle_mode_select_entity | string | trim %}
                              {% set desired = cutting_path_angle_mode_option | string %}
                              {{ e | length > 0 and states(e) | string != desired }}
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: "{{ cutting_path_angle_mode_select_entity }}"
                            data:
                              option: "{{ cutting_path_angle_mode_option }}"
                            continue_on_error: true
                  - alias: "Set mow order before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = mow_order_select_entity | string | trim %}
                              {% set desired = mow_order_option | string %}
                              {{ e | length > 0 and states(e) | string != desired }}
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: "{{ mow_order_select_entity }}"
                            data:
                              option: "{{ mow_order_option }}"
                            continue_on_error: true
                  - alias: "Set no-go zone laps before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = no_go_laps_select_entity | string | trim %}
                              {% set desired = no_go_laps_option | string %}
                              {{ e | length > 0 and states(e) | string != desired }}
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: "{{ no_go_laps_select_entity }}"
                            data:
                              option: "{{ no_go_laps_option }}"
                            continue_on_error: true
                  - alias: "Set obstacle avoidance before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = obstacle_avoidance_select_entity | string | trim %}
                              {% set desired = obstacle_avoidance_option | string %}
                              {{ e | length > 0 and states(e) | string != desired }}
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: "{{ obstacle_avoidance_select_entity }}"
                            data:
                              option: "{{ obstacle_avoidance_option }}"
                            continue_on_error: true
                  - alias: "Set perimeter laps before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = perimeter_laps_select_entity | string | trim %}
                              {% set desired = perimeter_laps_option | string %}
                              {{ e | length > 0 and states(e) | string != desired }}
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: "{{ perimeter_laps_select_entity }}"
                            data:
                              option: "{{ perimeter_laps_option }}"
                            continue_on_error: true
                  - alias: "Set traversal mode before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = traversal_mode_select_entity | string | trim %}
                              {% set desired = traversal_mode_option | string %}
                              {{ e | length > 0 and states(e) | string != desired }}
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: "{{ traversal_mode_select_entity }}"
                            data:
                              option: "{{ traversal_mode_option }}"
                            continue_on_error: true
                  - alias: "Set turnaround mode before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = turnaround_mode_select_entity | string | trim %}
                              {% set desired = turnaround_mode_option | string %}
                              {{ e | length > 0 and states(e) | string != desired }}
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: "{{ turnaround_mode_select_entity }}"
                            data:
                              option: "{{ turnaround_mode_option }}"
                            continue_on_error: true
                  - alias: "Set wildlife safety before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = wildlife_safety_select_entity | string | trim %}
                              {% set desired = wildlife_safety_option | string %}
                              {{
                                not (wildlife_safety_sun_schedule_enabled | bool)
                                and e | length > 0
                                and states(e) | string != desired
                              }}
                        sequence:
                          - service: select.select_option
                            target:
                              entity_id: "{{ wildlife_safety_select_entity }}"
                            data:
                              option: "{{ wildlife_safety_option }}"
                            continue_on_error: true
                  - alias: "Ensure auto lighting/night light is on before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = night_light_switch_entity | string | trim %}
                              {{ e | length > 0 and not is_state(e, 'on') }}
                        sequence:
                          - service: switch.turn_on
                            target:
                              entity_id: "{{ night_light_switch_entity }}"
                            continue_on_error: true
                  - alias: "Ensure rain detection during mow is on before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = rain_detection_during_mow_switch_entity | string | trim %}
                              {{ e | length > 0 and not is_state(e, 'on') }}
                        sequence:
                          - service: switch.turn_on
                            target:
                              entity_id: "{{ rain_detection_during_mow_switch_entity }}"
                            continue_on_error: true
                  - alias: "Ensure mower rain detection is on before Zone B"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {% set e = rain_detection_mower_switch_entity | string | trim %}
                              {{ e | length > 0 and not is_state(e, 'on') }}
                        sequence:
                          - service: switch.turn_on
                            target:
                              entity_id: "{{ rain_detection_mower_switch_entity }}"
                            continue_on_error: true
                  - alias: "Start mowing Zone B"
                    service: lawn_mower.start_mowing
                    target:
                      entity_id: !input mower_entity

                  - alias: "One-time pause recovery after Zone B start"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ post_start_pause_resume_window | int > 0 }}"
                        sequence:
                          - wait_for_trigger:
                              - platform: state
                                entity_id: !input mower_entity
                                to: "paused"
                                id: post_start_paused
                              - platform: state
                                entity_id: !input weather_entity
                                to:
                                  - "rainy"
                                  - "pouring"
                                  - "lightning-rainy"
                                  - "hail"
                                  - "snowy-rainy"
                                  - "exceptional"
                                id: rain
                            timeout:
                              seconds: "{{ post_start_pause_resume_window | int }}"
                            continue_on_timeout: true
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ wait.trigger is not none and wait.trigger.id == 'post_start_paused' }}"
                                sequence:
                                  - service: lawn_mower.start_mowing
                                    target:
                                      entity_id: !input mower_entity
                                    continue_on_error: true
                                  - service: notify.persistent_notification
                                    data:
                                      title: "▶️ {{ mower_display_name }} fortgesetzt — Zone B"
                                      message: >
                                        Der Mäher hat kurz nach dem Start von {{ zone_b_name }} pausiert.
                                        Ein einmaliger Fortsetzen-Befehl wurde gesendet.
                              - conditions:
                                  - condition: template
                                    value_template: "{{ wait.trigger is not none and wait.trigger.id == 'rain' }}"
                                sequence:
                                  - service: lawn_mower.dock
                                    target:
                                      entity_id: !input mower_entity
                                  - service: input_datetime.set_datetime
                                    target:
                                      entity_id: !input rain_last_seen
                                    data:
                                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                                  - service: notify.persistent_notification
                                    data:
                                      title: "🌧️ {{ mower_display_name }} während Zone-B-Start zurückgerufen"
                                      message: >
                                        Während des Starts von {{ zone_b_name }} wurde Regen erkannt.
                                        Der Mäher wurde zur Ladestation geschickt und der Zonenzähler wurde nicht weitergesetzt.
                                  - stop: "Regen während des Start-/Wiederaufnahmefensters erkannt"

                  - alias: "Wait for Zone B to complete, timeout, or rain to interrupt"
                    wait_for_trigger:
                      - platform: state
                        entity_id: !input weather_entity
                        to:
                          - "rainy"
                          - "pouring"
                          - "lightning-rainy"
                          - "hail"
                          - "snowy-rainy"
                          - "exceptional"
                        id: rain
                      - platform: template
                        id: complete
                        value_template: >
                          {% set progress_entity = mower_progress_sensor | string | trim %}
                          {% set time_left_entity = mower_time_left_sensor | string | trim %}
                          {% set task_entity = mower_task_status_sensor | string | trim %}
                          {% set activity_entity = mower_activity_mode_sensor | string | trim %}
                          {% set progress = states(progress_entity) | float(-1) if progress_entity | length > 0 else -1 %}
                          {% set time_left = states(time_left_entity) | float(999) if time_left_entity | length > 0 else 999 %}
                          {% set task = states(task_entity) | upper if task_entity | length > 0 else '' %}
                          {% set activity = states(activity_entity) | upper if activity_entity | length > 0 else '' %}
                          {% set mower = states(mower_entity) | lower %}
                          {{
                            task == 'COMPLETE'
                            or (
                              time_left <= 0
                              and progress >= 99
                              and activity not in ['MODE_WORKING', 'MODE_MOWING']
                            )
                            or (
                              mower in ['docked', 'idle']
                              and progress >= 99
                              and time_left <= 0
                            )
                          }}
                    timeout:
                      minutes: "{{ zone_duration | int }}"
                    continue_on_timeout: true

                  - alias: "Three-minute grace period after Zone B completion signal"
                    choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ wait.trigger is not none and wait.trigger.id == 'complete' }}"
                        sequence:
                          - delay:
                              minutes: 3

                  - alias: "Return mower to dock after Zone B"
                    service: lawn_mower.dock
                    target:
                      entity_id: !input mower_entity

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ wait.trigger is none or wait.trigger.id == 'complete' }}"
                        sequence:
                          - service: input_number.set_value
                            target:
                              entity_id: !input zone_tracker
                            data:
                              value: "{{ zone_b | int }}"
                          - service: input_datetime.set_datetime
                            target:
                              entity_id: !input last_run_tracker
                            data:
                              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                          - service: notify.persistent_notification
                            data:
                              title: "✅ {{ mower_display_name }} abgeschlossen — {{ zone_b_name }}"
                              message: >
                                Zone {{ zone_b }} ({{ zone_b_name }}) wurde abgeschlossen.
                                Zonenzähler wurde auf {{ zone_b }} weitergesetzt.
                      - conditions:
                          - condition: template
                            value_template: "{{ wait.trigger is not none and wait.trigger.id == 'rain' }}"
                        sequence:
                          - service: input_datetime.set_datetime
                            target:
                              entity_id: !input rain_last_seen
                            data:
                              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                          - service: notify.persistent_notification
                            data:
                              title: "🌧️ {{ mower_display_name }} während des Mähens zurückgerufen — Zone B"
                              message: >
                                Während des Mähens von {{ zone_b_name }} wurde Regen erkannt. Der Mäher wurde zur Ladestation geschickt.
                                Zonenzähler bleibt bei {{ zone_a }}.
                                Trocknungszeit nach Regen: {{ wet_lawn_dry_out_delay_hours }} Stunden.
