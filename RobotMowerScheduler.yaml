blueprint:
  name: "Robot Mower Scheduler"
  description: >
    Robot mower scheduler for Mammotion mowers using the newer Mammotion
    integration entity model. It rotates through configured area switches,
    applies mower setting entities such as blade height, working speed, path
    mode, mow order, obstacle behavior, perimeter laps, traversal mode, and
    turnaround mode, then starts the mower through the lawn_mower entity.

    This public version uses generic configurable entity inputs and contains no private mower names.

    ── WHAT THIS BLUEPRINT DOES ─────────────────────────────────────────────
    1. Runs up to four scheduled mow sessions per day, each with its own
       allowed days.
    2. Supports a manual Start Next Mow input_button trigger.
    3. Rotates through the first N active Mammotion area switches.
    4. Uses the kept helpers for zone rotation, manual skip, last run, rain
       dry-out tracking, and manual triggering.
    5. Applies new-integration number/select/switch entities before each mow.
    6. Checks rain at session start, during mowing, and before Zone B.
    7. Checks an optional temperature sensor before starting Zone A and Zone B.
    8. Optionally raises blade height during hot weather based on the temperature sensor.
    9. Supports a configurable wet-lawn dry-out delay after rain.
    9. Uses time-left based completion plus a 3-minute grace delay before docking.
    10. Enforces an optional minimum time between successful mowing runs.
    11. Guards against interrupting a recent low-battery unfinished-task resume
       condition using Last Error, Last Error Time, optional Last Error Code,
       optional Charging, and optional Activity Mode entities.

    ── REQUIRED HELPERS ─────────────────────────────────────────────────────
    Create these helpers at Settings → Devices & Services → Helpers:
      • input_number  — Mower Last Zone, min=0, max=6, step=1, initial=0
      • input_boolean — Mower Manual Skip
      • input_datetime— Mower Last Run, date and time
      • input_datetime— Mower Rain Last Seen, date and time
      • input_button  — Mower Start Next Mow

    ── NEW MAMMOTION INTEGRATION MODEL ─────────────────────────────────────
    The mower settings are applied using Home Assistant entities such as
    number.*_blade_height, number.*_working_speed, select.*_cutting_path_mode,
    select.*_mow_order, select.*_obstacle_avoidance_mode, and related entities.
    Any optional setting entity left blank is skipped.

  domain: automation
  source_url: https://community.home-assistant.io

  input:
    mower_section:
      name: Mower
      icon: mdi:robot-mower
      input:
        mower_entity:
          name: Mower Entity
          description: Main lawn_mower entity.
          default: ""
          selector:
            entity:
              domain: lawn_mower

        mower_display_name:
          name: Mower Display Name
          description: Name used in notifications.
          default: Mower
          selector:
            text: {}

        manual_start_button:
          name: Manual Start Next Mow Button
          description: input_button helper used to manually start the next mow using this blueprint's full safety logic.
          default: input_button.mower_start_next_mow
          selector:
            entity:
              domain: input_button

    status_section:
      name: Mower Status / Resume Protection
      icon: mdi:shield-alert
      collapsed: true
      input:
        mower_last_error_sensor:
          name: Last Error Sensor
          description: Optional Mammotion Last Error sensor. Used only with recency checks because this may be historical.
          default: ""
          selector:
            entity:
              domain: sensor

        mower_last_error_time_sensor:
          name: Last Error Time Sensor
          description: Optional timestamp sensor for when the last error occurred. Preferred over last_changed.
          default: ""
          selector:
            entity:
              domain: sensor

        mower_last_error_code_sensor:
          name: Last Error Code Sensor
          description: Optional Mammotion error-code sensor. Useful when the text says Error message not found.
          default: ""
          selector:
            entity:
              domain: sensor

        low_battery_resume_error_codes:
          name: Low-Battery Resume Error Codes
          description: >
            Optional comma-separated error codes that mean low battery / unfinished task will resume.
            Leave blank to use text matching only. Verify codes for your mower/integration.
          default: ""
          selector:
            text: {}

        mower_charging_binary_sensor:
          name: Charging Binary Sensor
          description: Optional binary_sensor that is on when the mower is charging.
          default: ""
          selector:
            entity:
              domain: binary_sensor

        mower_activity_mode_sensor:
          name: Activity Mode Sensor
          description: Optional activity/status sensor, such as MODE_WORKING, MODE_CHARGING, or similar.
          default: ""
          selector:
            entity:
              domain: sensor

        mower_progress_sensor:
          name: Mower Progress Sensor
          description: Optional progress sensor used to detect when a mowing task has completed.
          default: ""
          selector:
            entity:
              domain: sensor

        mower_time_left_sensor:
          name: Mower Time Left Sensor
          description: Optional time-left sensor used as a secondary completion signal.
          default: ""
          selector:
            entity:
              domain: sensor

        mower_task_status_sensor:
          name: Mower Task Area Status Sensor
          description: Optional task-area status sensor. If it reports COMPLETE, the zone tracker advances immediately.
          default: ""
          selector:
            entity:
              domain: sensor

        mower_battery_level_sensor:
          name: Mower Battery Level Sensor
          description: >
            Optional battery level sensor. If configured, Zone A and Zone B only
            start when the battery level is at or above the configured minimum.
            If configured but unavailable or invalid, the start is skipped for safety.
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: battery

        minimum_battery_before_start:
          name: Minimum Battery Before Start
          description: >
            Minimum battery level required before starting Zone A or Zone B.
            This check is disabled when no battery sensor is configured.
          default: 80
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

        mower_start_state_check_enabled:
          name: Mower State Check Before Start
          description: >
            If enabled, Zone A and Zone B only start when the lawn_mower entity
            is in one of the configured allowed states. This helps prevent starts
            while the mower is already mowing, returning, paused, in error, or unavailable.
          default: true
          selector:
            boolean: {}

        allowed_mower_states_before_start:
          name: Allowed Mower States Before Start
          description: >
            Mower states that are allowed before starting Zone A or Zone B.
            The default allows starts only when the mower is docked or idle.
          default:
            - docked
            - idle
          selector:
            select:
              multiple: true
              options:
                - label: "docked"
                  value: "docked"
                - label: "idle"
                  value: "idle"
                - label: "paused"
                  value: "paused"
                - label: "returning"
                  value: "returning"
                - label: "mowing"
                  value: "mowing"
                - label: "error"
                  value: "error"

        resume_error_guard_hours:
          name: Low-Battery Resume Error Guard Time
          description: How long a recent matching low-battery/resume error should block starting a new scheduled task.
          default: 6
          selector:
            number:
              min: 1
              max: 24
              step: 1
              unit_of_measurement: h
              mode: slider

    zone_switches_section:
      name: Zone Area Switches
      icon: mdi:toggle-switch
      description: Select the Mammotion area switch for each zone. Only the first Active Zone Count switches are used.
      collapsed: true
      input:
        zone_1_switch:
          name: "Zone 1 — Area Switch"
          description: >
            Mammotion area switch for zone 1. This switch is enabled when zone 1 is selected for
            mowing.
          default: ""
          selector:
            entity:
              domain: switch
              integration: mammotion

        zone_2_switch:
          name: "Zone 2 — Area Switch"
          description: >
            Mammotion area switch for zone 2. This switch is enabled when zone 2 is selected for
            mowing.
          default: ""
          selector:
            entity:
              domain: switch
              integration: mammotion

        zone_3_switch:
          name: "Zone 3 — Area Switch"
          description: >
            Mammotion area switch for zone 3. This switch is enabled when zone 3 is selected for
            mowing.
          default: ""
          selector:
            entity:
              domain: switch
              integration: mammotion

        zone_4_switch:
          name: "Zone 4 — Area Switch"
          description: >
            Mammotion area switch for zone 4. This switch is enabled when zone 4 is selected for
            mowing.
          default: ""
          selector:
            entity:
              domain: switch
              integration: mammotion

        zone_5_switch:
          name: "Zone 5 — Area Switch"
          description: >
            Mammotion area switch for zone 5. This switch is enabled when zone 5 is selected for
            mowing.
          default: ""
          selector:
            entity:
              domain: switch
              integration: mammotion

        zone_6_switch:
          name: "Zone 6 — Area Switch"
          description: >
            Mammotion area switch for zone 6. This switch is enabled when zone 6 is selected for
            mowing.
          default: ""
          selector:
            entity:
              domain: switch
              integration: mammotion

    zone_names_section:
      name: Zone Display Names
      icon: mdi:tag-text
      collapsed: true
      input:
        zone_1_name:
          name: "Zone 1 — Display Name"
          description: >
            Display name used in notifications for zone 1.
          default: "Zone 1"
          selector:
            text: {}

        zone_2_name:
          name: "Zone 2 — Display Name"
          description: >
            Display name used in notifications for zone 2.
          default: "Zone 2"
          selector:
            text: {}

        zone_3_name:
          name: "Zone 3 — Display Name"
          description: >
            Display name used in notifications for zone 3.
          default: "Zone 3"
          selector:
            text: {}

        zone_4_name:
          name: "Zone 4 — Display Name"
          description: >
            Display name used in notifications for zone 4.
          default: "Zone 4"
          selector:
            text: {}

        zone_5_name:
          name: "Zone 5 — Display Name"
          description: >
            Display name used in notifications for zone 5.
          default: "Zone 5"
          selector:
            text: {}

        zone_6_name:
          name: "Zone 6 — Display Name"
          description: >
            Display name used in notifications for zone 6.
          default: "Zone 6"
          selector:
            text: {}

    weather_section:
      name: Weather & Rain
      icon: mdi:weather-rainy
      input:
        weather_entity:
          name: Forecast Weather Entity
          description: Sessions are skipped when state is rainy, pouring, lightning-rainy, hail, snowy-rainy, or exceptional.
          default: ""
          selector:
            entity:
              domain: weather
        temperature_sensor:
          name: Temperature Sensor
          description: >
            Optional temperature sensor used to prevent mowing when it is too warm.
            If configured, the mower only starts when the current temperature is below
            the configured maximum start temperature.
          default: ""
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
        max_start_temperature:
          name: Maximum Start Temperature
          description: >
            Mowing is only started when the current temperature is below this value.
            If a temperature sensor is configured but unavailable or invalid, the session
            is skipped for safety.
          default: 28
          selector:
            number:
              min: 0
              max: 45
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        wet_lawn_dry_out_delay_hours:
          name: Wet Lawn Dry-Out Delay
          description: >
            Dry-out delay in hours after rain was detected. During this time,
            scheduled and manual mowing starts are skipped. Set to 0 to disable
            the dry-out delay after rain.
          default: 6
          selector:
            number:
              min: 0
              max: 24
              step: 1
              unit_of_measurement: h
              mode: slider

    session_1_section:
      name: "Session 1"
      icon: mdi:clock-start
      input:
        mow_time_1:
          name: "Session 1 — Start Time"
          description: >
            Start time for scheduled mowing session 1.
          default: "04:00:00"
          selector:
            time: {}
        days_session_1:
          name: "Session 1 — Active Days"
          description: >
            Weekdays on which scheduled mowing session 1 is allowed to run.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: "Monday"
                  value: mon
                - label: "Tuesday"
                  value: tue
                - label: "Wednesday"
                  value: wed
                - label: "Thursday"
                  value: thu
                - label: "Friday"
                  value: fri
                - label: "Saturday"
                  value: sat
                - label: "Sunday"
                  value: sun

    session_2_section:
      name: "Session 2"
      icon: mdi:clock-start
      input:
        mow_time_2:
          name: "Session 2 — Start Time"
          description: >
            Start time for scheduled mowing session 2.
          default: "18:30:00"
          selector:
            time: {}
        days_session_2:
          name: "Session 2 — Active Days"
          description: >
            Weekdays on which scheduled mowing session 2 is allowed to run.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: "Monday"
                  value: mon
                - label: "Tuesday"
                  value: tue
                - label: "Wednesday"
                  value: wed
                - label: "Thursday"
                  value: thu
                - label: "Friday"
                  value: fri
                - label: "Saturday"
                  value: sat
                - label: "Sunday"
                  value: sun

    session_3_section:
      name: "Session 3 (optional)"
      icon: mdi:clock-start
      collapsed: true
      input:
        mow_time_3:
          name: "Session 3 — Start Time"
          description: >
            Start time for optional scheduled mowing session 3. Leave the active days empty to
            disable this session.
          default: "04:00:00"
          selector:
            time: {}
        days_session_3:
          name: "Session 3 — Active Days"
          description: >
            Weekdays on which optional scheduled mowing session 3 is allowed to run. Leave empty
            to disable this session.
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: "Monday"
                  value: mon
                - label: "Tuesday"
                  value: tue
                - label: "Wednesday"
                  value: wed
                - label: "Thursday"
                  value: thu
                - label: "Friday"
                  value: fri
                - label: "Saturday"
                  value: sat
                - label: "Sunday"
                  value: sun

    session_4_section:
      name: "Session 4 (optional)"
      icon: mdi:clock-start
      collapsed: true
      input:
        mow_time_4:
          name: "Session 4 — Start Time"
          description: >
            Start time for optional scheduled mowing session 4. Leave the active days empty to
            disable this session.
          default: "18:30:00"
          selector:
            time: {}
        days_session_4:
          name: "Session 4 — Active Days"
          description: >
            Weekdays on which optional scheduled mowing session 4 is allowed to run. Leave empty
            to disable this session.
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: "Monday"
                  value: mon
                - label: "Tuesday"
                  value: tue
                - label: "Wednesday"
                  value: wed
                - label: "Thursday"
                  value: thu
                - label: "Friday"
                  value: fri
                - label: "Saturday"
                  value: sat
                - label: "Sunday"
                  value: sun

    helpers_section:
      name: Helpers
      icon: mdi:database
      collapsed: true
      input:
        zone_tracker:
          name: Zone Tracker (input_number)
          description: >
            input_number helper that stores the last completed zone number for round-robin zone
            rotation.
          default: ""
          selector:
            entity:
              domain: input_number
        skip_toggle:
          name: Manual Skip Toggle (input_boolean)
          description: >
            input_boolean helper used to manually skip mowing sessions while enabled.
          default: ""
          selector:
            entity:
              domain: input_boolean
        garden_in_use_toggle:
          name: Garden In Use Toggle (input_boolean)
          description: >
            Optional input_boolean helper. When this helper is on, mowing sessions
            are skipped because the garden is currently being used. Wildlife Safety
            sun schedule checks are not affected.
          default: ""
          selector:
            entity:
              domain: input_boolean
        last_run_tracker:
          name: Last Run Datetime (input_datetime)
          description: >
            input_datetime helper that stores the time of the last successful mowing run.
          default: ""
          selector:
            entity:
              domain: input_datetime
        rain_last_seen:
          name: Rain Last Seen (input_datetime)
          description: >
            input_datetime helper that stores when rain was last detected for wet-lawn dry-out
            handling.
          default: ""
          selector:
            entity:
              domain: input_datetime

    behaviour_section:
      name: Mowing Behaviour
      icon: mdi:tune
      collapsed: true
      input:
        active_zone_count:
          name: Active Zone Count
          description: Number of configured mowing zones to cycle through.
          default: 6
          selector:
            number:
              min: 1
              max: 6
              step: 1
              mode: slider
        zones_per_session:
          name: Zones Per Session
          description: >
            Number of zones to mow during one session. If only one active zone exists, this is
            forced to one.
          default: 1
          selector:
            number:
              min: 1
              max: 2
              step: 1
              mode: slider
        zone_duration:
          name: Zone Duration Ceiling (minutes)
          description: >
            Maximum runtime allowed for each zone before the mower is sent back to dock.
          default: 90
          selector:
            number:
              min: 15
              max: 300
              step: 5
              unit_of_measurement: min
              mode: slider
        inter_zone_rest:
          name: Rest Between Zones (minutes)
          description: >
            Rest period between Zone A and Zone B when two zones are mowed in one session.
          default: 40
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: slider

        minimum_time_between_mows:
          name: Minimum Time Between Mowing Runs
          description: >
            Minimum time in hours between successful mowing runs. The value is
            checked against the Last Run Datetime helper before Zone A starts.
            Set to 0 to disable this check.
          default: 0
          selector:
            number:
              min: 0
              max: 72
              step: 1
              unit_of_measurement: h
              mode: slider
        dry_run_mode:
          name: Dry-Run/Test Mode
          description: >
            If enabled, the scheduler evaluates the configured start conditions and
            sends a test notification, but does not change area switches, does not
            apply mower settings, does not start the mower, and does not update the
            Last Run helper. The Wildlife Safety sun schedule is not affected.
          default: false
          selector:
            boolean: {}

        post_start_pause_resume_window:
          name: Immediate Pause Recovery Window (seconds)
          description: Watch briefly after start; if the mower becomes paused, send one continue command.
          default: 75
          selector:
            number:
              min: 0
              max: 180
              step: 5
              unit_of_measurement: s
              mode: slider

    new_integration_settings_section:
      name: Mammotion Mowing Settings
      icon: mdi:robot-mower-outline
      description: >
        Optional new-integration setting entities. Set the entity ID and desired value.
        Blank entity IDs are skipped. Defaults match conservative mower settings.
      collapsed: true
      input:
        blade_height_number_entity:
          name: Blade Height Number Entity
          description: >
            Optional Mammotion number entity used to set the mower blade height before mowing.
          default: ""
          selector:
            entity:
              domain: number
        mammotion_blade_height:
          name: Blade Height (mm)
          description: Normal blade height used when hot-weather blade height is disabled or not active.
          default: 100
          selector:
            number:
              min: 20
              max: 100
              step: 1
              unit_of_measurement: mm
              mode: slider

        hot_weather_blade_height_enabled:
          name: Hot Weather Blade Height Enabled
          description: >
            If enabled, the scheduler uses the configured hot-weather blade height
            when the configured temperature sensor reports a value at or above the
            hot-weather threshold. If no temperature sensor is configured, the normal
            blade height is used.
          default: false
          selector:
            boolean: {}

        hot_weather_blade_height_temperature:
          name: Hot Weather Blade Height Temperature
          description: >
            Temperature threshold for using the hot-weather blade height.
            The temperature sensor from Weather & Rain is used.
          default: 26
          selector:
            number:
              min: 15
              max: 40
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        mammotion_hot_weather_blade_height:
          name: Hot Weather Blade Height (mm)
          description: Blade height used when hot-weather blade height is active.
          default: 80
          selector:
            number:
              min: 20
              max: 100
              step: 1
              unit_of_measurement: mm
              mode: slider

        working_speed_number_entity:
          name: Working Speed Number Entity
          description: >
            Optional Mammotion number entity used to set the working speed before mowing.
          default: ""
          selector:
            entity:
              domain: number
        mammotion_working_speed:
          name: Working Speed (m/s)
          description: >
            Desired working speed in meters per second.
          default: 0.3
          selector:
            number:
              min: 0.1
              max: 1.2
              step: 0.1
              unit_of_measurement: m/s
              mode: slider

        cutting_path_angle_number_entity:
          name: Cutting Path Angle Number Entity
          description: >
            Optional Mammotion number entity used to set the cutting path angle before mowing.
          default: ""
          selector:
            entity:
              domain: number
        mammotion_cutting_path_angle:
          name: Cutting Path Angle (degrees)
          description: >
            Desired cutting path angle in degrees.
          default: 90
          selector:
            number:
              min: -180
              max: 180
              step: 1
              unit_of_measurement: "°"
              mode: slider

        crossing_angle_number_entity:
          name: Crossing Angle Number Entity (optional)
          description: >
            Optional Mammotion number entity used to set the crossing angle before mowing.
          default: ""
          selector:
            entity:
              domain: number
        mammotion_crossing_angle:
          name: Crossing Angle (degrees)
          description: >
            Desired crossing angle in degrees.
          default: 90
          selector:
            number:
              min: -180
              max: 180
              step: 1
              unit_of_measurement: "°"
              mode: slider

        path_spacing_number_entity:
          name: Path Spacing Number Entity
          description: >
            Optional Mammotion number entity used to set the mowing path spacing before mowing.
          default: ""
          selector:
            entity:
              domain: number
        mammotion_path_spacing:
          name: Path Spacing (cm)
          description: >
            Desired distance between mowing paths in centimeters.
          default: 12
          selector:
            number:
              min: 8
              max: 30
              step: 1
              unit_of_measurement: cm
              mode: slider

        start_progress_number_entity:
          name: Start Progress Number Entity (optional)
          description: >
            Optional Mammotion number entity used to set the starting progress percentage before
            mowing.
          default: ""
          selector:
            entity:
              domain: number
        mammotion_start_progress:
          name: Start Progress (%)
          description: >
            Desired start progress percentage. Usually 0 to start from the beginning.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        cutter_speed_select_entity:
          name: Cutter Speed Select Entity
          description: >
            Optional Mammotion select entity used to set the cutter speed before mowing.
          default: ""
          selector:
            entity:
              domain: select
        cutter_speed_option:
          name: Cutter Speed Option
          description: >
            Desired cutter speed option to apply before mowing.
          default: "fast"
          selector:
            select:
              options:
                - label: "normal"
                  value: "normal"
                - label: "slow"
                  value: "slow"
                - label: "fast"
                  value: "fast"

        cutting_path_mode_select_entity:
          name: Cutting Path Mode Select Entity
          description: >
            Optional Mammotion select entity used to set the cutting path mode before mowing.
          default: ""
          selector:
            entity:
              domain: select
        cutting_path_mode_option:
          name: Cutting Path Mode Option
          description: >
            Desired cutting path mode option to apply before mowing.
          default: "single_grid"
          selector:
            select:
              options:
                - label: "single_grid"
                  value: "single_grid"
                - label: "double_grid"
                  value: "double_grid"
                - label: "segment_grid"
                  value: "segment_grid"
                - label: "no_grid"
                  value: "no_grid"

        cutting_path_angle_mode_select_entity:
          name: Cutting Path Angle Mode Select Entity
          description: >
            Optional Mammotion select entity used to set the cutting path angle mode before
            mowing.
          default: ""
          selector:
            entity:
              domain: select
        cutting_path_angle_mode_option:
          name: Cutting Path Angle Mode Option
          description: >
            Desired cutting path angle mode option to apply before mowing.
          default: "relative_angle"
          selector:
            select:
              options:
                - label: "relative_angle"
                  value: "relative_angle"
                - label: "absolute_angle"
                  value: "absolute_angle"
                - label: "random_angle"
                  value: "random_angle"

        mow_order_select_entity:
          name: Mow Order Select Entity
          description: >
            Optional Mammotion select entity used to set whether borders or grid lines are mowed
            first.
          default: ""
          selector:
            entity:
              domain: select
        mow_order_option:
          name: Mow Order Option
          description: >
            Desired mowing order option to apply before mowing.
          default: "border_first"
          selector:
            select:
              options:
                - label: "border_first"
                  value: "border_first"
                - label: "grid_first"
                  value: "grid_first"

        no_go_laps_select_entity:
          name: No-go Zone Mowing Laps Select Entity
          description: >
            Optional Mammotion select entity used to set the number of laps around no-go zones.
          default: ""
          selector:
            entity:
              domain: select
        no_go_laps_option:
          name: No-go Zone Mowing Laps Option
          description: >
            Desired number of mowing laps around no-go zones.
          default: "one"
          selector:
            select:
              options:
                - label: "none"
                  value: "none"
                - label: "one"
                  value: "one"
                - label: "two"
                  value: "two"
                - label: "three"
                  value: "three"
                - label: "four"
                  value: "four"

        obstacle_avoidance_select_entity:
          name: Obstacle Avoidance Mode Select Entity
          description: >
            Optional Mammotion select entity used to set obstacle avoidance behavior before
            mowing.
          default: ""
          selector:
            entity:
              domain: select
        obstacle_avoidance_option:
          name: Obstacle Avoidance Option
          description: >
            Desired obstacle avoidance option to apply before mowing.
          default: "no_touch"
          selector:
            select:
              options:
                - label: "direct_touch"
                  value: "direct_touch"
                - label: "no_touch"
                  value: "no_touch"
                - label: "sensitive"
                  value: "sensitive"

        perimeter_laps_select_entity:
          name: Perimeter Mowing Laps Select Entity
          description: >
            Optional Mammotion select entity used to set the number of perimeter mowing laps.
          default: ""
          selector:
            entity:
              domain: select
        perimeter_laps_option:
          name: Perimeter Mowing Laps Option
          description: >
            Desired number of perimeter mowing laps.
          default: "two"
          selector:
            select:
              options:
                - label: "none"
                  value: "none"
                - label: "one"
                  value: "one"
                - label: "two"
                  value: "two"
                - label: "three"
                  value: "three"
                - label: "four"
                  value: "four"

        traversal_mode_select_entity:
          name: Traversal Mode Select Entity
          description: >
            Optional Mammotion select entity used to set how the mower travels between areas.
          default: ""
          selector:
            entity:
              domain: select
        traversal_mode_option:
          name: Traversal Mode Option
          description: >
            Desired traversal mode option to apply before mowing.
          default: "follow_perimeter"
          selector:
            select:
              options:
                - label: "direct"
                  value: "direct"
                - label: "follow_perimeter"
                  value: "follow_perimeter"

        turnaround_mode_select_entity:
          name: Turnaround Mode Select Entity
          description: >
            Optional Mammotion select entity used to set the turnaround behavior at path ends.
          default: ""
          selector:
            entity:
              domain: select
        turnaround_mode_option:
          name: Turnaround Mode Option
          description: >
            Desired turnaround mode option to apply before mowing.
          default: "zero_turn"
          selector:
            select:
              options:
                - label: "zero_turn"
                  value: "zero_turn"
                - label: "multipoint"
                  value: "multipoint"

        wildlife_safety_select_entity:
          name: Wildlife Safety Select Entity
          description: >
            Optional Mammotion Wildlife Safety select entity. If the sun-based
            Wildlife Safety schedule is enabled, this entity is set to
            low_speed_mowing at sunset and off at sunrise.
          default: ""
          selector:
            entity:
              domain: select

        wildlife_safety_sun_schedule_enabled:
          name: Wildlife Safety Sun Schedule Enabled
          description: >
            If enabled, Wildlife Safety is automatically set to low_speed_mowing
            around sunset and off around sunrise. The exact timing can be adjusted
            with the sunset and sunrise offset sliders. In this mode, the normal
            mow-start setting for Wildlife Safety is not applied before Zone A or Zone B.
          default: true
          selector:
            boolean: {}

        wildlife_safety_sunset_offset_minutes:
          name: Wildlife Safety Sunset Offset
          description: >
            Offset in minutes relative to sunset. Negative values run before sunset,
            positive values run after sunset. Example: -30 means 30 minutes before sunset.
          default: 0
          selector:
            number:
              min: -60
              max: 60
              step: 5
              unit_of_measurement: min
              mode: slider

        wildlife_safety_sunrise_offset_minutes:
          name: Wildlife Safety Sunrise Offset
          description: >
            Offset in minutes relative to sunrise. Negative values run before sunrise,
            positive values run after sunrise. Example: 30 means 30 minutes after sunrise.
          default: 0
          selector:
            number:
              min: -60
              max: 60
              step: 5
              unit_of_measurement: min
              mode: slider

        wildlife_safety_option:
          name: Wildlife Safety Option Before Mowing
          description: >
            Used only when the sun-based Wildlife Safety schedule is disabled.
            If the sun schedule is enabled, Wildlife Safety is controlled by
            sunrise and sunset instead.
          default: "low_speed_mowing"
          selector:
            select:
              options:
                - label: "off"
                  value: "off"
                - label: "stop_mowing"
                  value: "stop_mowing"
                - label: "low_speed_mowing"
                  value: "low_speed_mowing"

        night_light_switch_entity:
          name: Auto Lighting / Night Light Switch Entity
          description: >
            Optional Mammotion switch entity used to enable automatic lighting or night light
            before mowing.
          default: ""
          selector:
            entity:
              domain: switch
        rain_detection_during_mow_switch_entity:
          name: Rain Detection During Mow Switch Entity
          description: >
            Optional Mammotion switch entity used to enable rain detection while mowing.
          default: ""
          selector:
            entity:
              domain: switch
        rain_detection_mower_switch_entity:
          name: Mower Rain Detection Switch Entity
          description: >
            Optional Mammotion switch entity used to enable the mower rain detection feature.
          default: ""
          selector:
            entity:
              domain: switch

trigger:
  - platform: time
    at: !input mow_time_1
    id: session_1
  - platform: time
    at: !input mow_time_2
    id: session_2
  - platform: time
    at: !input mow_time_3
    id: session_3
  - platform: time
    at: !input mow_time_4
    id: session_4
  - platform: state
    entity_id: !input manual_start_button
    id: manual_start
  - platform: time_pattern
    minutes: "/1"
    id: wildlife_sun_check

mode: single
max_exceeded: silent

variables:
  mower_entity: !input mower_entity
  mower_display_name: !input mower_display_name
  manual_start_button: !input manual_start_button
  mower_last_error_sensor: !input mower_last_error_sensor
  mower_last_error_time_sensor: !input mower_last_error_time_sensor
  mower_last_error_code_sensor: !input mower_last_error_code_sensor
  low_battery_resume_error_codes: !input low_battery_resume_error_codes
  mower_charging_binary_sensor: !input mower_charging_binary_sensor
  mower_activity_mode_sensor: !input mower_activity_mode_sensor
  mower_progress_sensor: !input mower_progress_sensor
  mower_time_left_sensor: !input mower_time_left_sensor
  mower_task_status_sensor: !input mower_task_status_sensor
  mower_battery_level_sensor: !input mower_battery_level_sensor
  minimum_battery_before_start: !input minimum_battery_before_start
  mower_start_state_check_enabled: !input mower_start_state_check_enabled
  allowed_mower_states_before_start: !input allowed_mower_states_before_start
  resume_error_guard_hours: !input resume_error_guard_hours
  weather_entity: !input weather_entity
  temperature_sensor: !input temperature_sensor
  max_start_temperature: !input max_start_temperature
  wet_lawn_dry_out_delay_hours: !input wet_lawn_dry_out_delay_hours
  zone_tracker: !input zone_tracker
  skip_toggle: !input skip_toggle
  garden_in_use_toggle: !input garden_in_use_toggle
  rain_last_seen: !input rain_last_seen
  zones_per_session: !input zones_per_session
  zone_duration: !input zone_duration
  inter_zone_rest: !input inter_zone_rest
  minimum_time_between_mows: !input minimum_time_between_mows
  dry_run_mode: !input dry_run_mode
  active_zone_count: !input active_zone_count
  post_start_pause_resume_window: !input post_start_pause_resume_window
  sw1: !input zone_1_switch
  sw2: !input zone_2_switch
  sw3: !input zone_3_switch
  sw4: !input zone_4_switch
  sw5: !input zone_5_switch
  sw6: !input zone_6_switch
  z1: !input zone_1_name
  z2: !input zone_2_name
  z3: !input zone_3_name
  z4: !input zone_4_name
  z5: !input zone_5_name
  z6: !input zone_6_name
  days_session_1: !input days_session_1
  days_session_2: !input days_session_2
  days_session_3: !input days_session_3
  days_session_4: !input days_session_4
  blade_height_number_entity: !input blade_height_number_entity
  mammotion_blade_height: !input mammotion_blade_height
  hot_weather_blade_height_enabled: !input hot_weather_blade_height_enabled
  hot_weather_blade_height_temperature: !input hot_weather_blade_height_temperature
  mammotion_hot_weather_blade_height: !input mammotion_hot_weather_blade_height
  working_speed_number_entity: !input working_speed_number_entity
  mammotion_working_speed: !input mammotion_working_speed
  cutting_path_angle_number_entity: !input cutting_path_angle_number_entity
  mammotion_cutting_path_angle: !input mammotion_cutting_path_angle
  crossing_angle_number_entity: !input crossing_angle_number_entity
  mammotion_crossing_angle: !input mammotion_crossing_angle
  path_spacing_number_entity: !input path_spacing_number_entity
  mammotion_path_spacing: !input mammotion_path_spacing
  start_progress_number_entity: !input start_progress_number_entity
  mammotion_start_progress: !input mammotion_start_progress
  cutter_speed_select_entity: !input cutter_speed_select_entity
  cutter_speed_option: !input cutter_speed_option
  cutting_path_mode_select_entity: !input cutting_path_mode_select_entity
  cutting_path_mode_option: !input cutting_path_mode_option
  cutting_path_angle_mode_select_entity: !input cutting_path_angle_mode_select_entity
  cutting_path_angle_mode_option: !input cutting_path_angle_mode_option
  mow_order_select_entity: !input mow_order_select_entity
  mow_order_option: !input mow_order_option
  no_go_laps_select_entity: !input no_go_laps_select_entity
  no_go_laps_option: !input no_go_laps_option
  obstacle_avoidance_select_entity: !input obstacle_avoidance_select_entity
  obstacle_avoidance_option: !input obstacle_avoidance_option
  perimeter_laps_select_entity: !input perimeter_laps_select_entity
  perimeter_laps_option: !input perimeter_laps_option
  traversal_mode_select_entity: !input traversal_mode_select_entity
  traversal_mode_option: !input traversal_mode_option
  turnaround_mode_select_entity: !input turnaround_mode_select_entity
  turnaround_mode_option: !input turnaround_mode_option
  wildlife_safety_select_entity: !input wildlife_safety_select_entity
  wildlife_safety_sun_schedule_enabled: !input wildlife_safety_sun_schedule_enabled
  wildlife_safety_sunset_offset_minutes: !input wildlife_safety_sunset_offset_minutes
  wildlife_safety_sunrise_offset_minutes: !input wildlife_safety_sunrise_offset_minutes
  wildlife_safety_option: !input wildlife_safety_option
  night_light_switch_entity: !input night_light_switch_entity
  rain_detection_during_mow_switch_entity: !input rain_detection_during_mow_switch_entity
  rain_detection_mower_switch_entity: !input rain_detection_mower_switch_entity

condition:
  - alias: "Skip mowing sessions if manual skip toggle is on; allow wildlife sun schedule checks"
    condition: template
    value_template: >
      {{ trigger.id == 'wildlife_sun_check' or not is_state(skip_toggle, 'on') }}

action:
  - choose:
      - conditions:
          - condition: template
            alias: "Set Wildlife Safety to low_speed_mowing based on sunset offset"
            value_template: >
              {% set e = wildlife_safety_select_entity | string | trim %}
              {% set enabled = wildlife_safety_sun_schedule_enabled | bool %}
              {% set offset = wildlife_safety_sunset_offset_minutes | int(0) %}
              {% set next_setting = as_timestamp(state_attr('sun.sun', 'next_setting'), none) %}
              {% set now_ts = as_timestamp(now()) %}
              {% if next_setting is none %}
                false
              {% else %}
                {% set target_ts = next_setting + (offset * 60) %}
                {% set previous_target_ts = (next_setting - 86400) + (offset * 60) %}
                {{
                  trigger.id == 'wildlife_sun_check'
                  and enabled
                  and e | length > 0
                  and states(e) != 'low_speed_mowing'
                  and (
                    (now_ts >= target_ts and now_ts < target_ts + 300)
                    or (now_ts >= previous_target_ts and now_ts < previous_target_ts + 300)
                  )
                }}
              {% endif %}
        sequence:
          - service: select.select_option
            target:
              entity_id: "{{ wildlife_safety_select_entity }}"
            data:
              option: "low_speed_mowing"
            continue_on_error: true
          - service: notify.persistent_notification
            data:
              title: "🦔 {{ mower_display_name }} Wildtierschutz aktiviert"
              message: >
                Der Sonnenuntergang-Zeitpunkt wurde erreicht. Wildlife Safety wurde auf
                low_speed_mowing gesetzt.

                Offset: {{ wildlife_safety_sunset_offset_minutes }} Minuten.
          - stop: "Wildtierschutz bei Sonnenuntergang aktiviert"

      - conditions:
          - condition: template
            alias: "Set Wildlife Safety to off based on sunrise offset"
            value_template: >
              {% set e = wildlife_safety_select_entity | string | trim %}
              {% set enabled = wildlife_safety_sun_schedule_enabled | bool %}
              {% set offset = wildlife_safety_sunrise_offset_minutes | int(0) %}
              {% set next_rising = as_timestamp(state_attr('sun.sun', 'next_rising'), none) %}
              {% set now_ts = as_timestamp(now()) %}
              {% if next_rising is none %}
                false
              {% else %}
                {% set target_ts = next_rising + (offset * 60) %}
                {% set previous_target_ts = (next_rising - 86400) + (offset * 60) %}
                {{
                  trigger.id == 'wildlife_sun_check'
                  and enabled
                  and e | length > 0
                  and states(e) != 'off'
                  and (
                    (now_ts >= target_ts and now_ts < target_ts + 300)
                    or (now_ts >= previous_target_ts and now_ts < previous_target_ts + 300)
                  )
                }}
              {% endif %}
        sequence:
          - service: select.select_option
            target:
              entity_id: "{{ wildlife_safety_select_entity }}"
            data:
              option: "off"
            continue_on_error: true
          - service: notify.persistent_notification
            data:
              title: "☀️ {{ mower_display_name }} Wildtierschutz deaktiviert"
              message: >
                Der Sonnenaufgang-Zeitpunkt wurde erreicht. Wildlife Safety wurde auf off gesetzt.

                Offset: {{ wildlife_safety_sunrise_offset_minutes }} Minuten.
          - stop: "Wildtierschutz bei Sonnenaufgang deaktiviert"

      - conditions:
          - condition: template
            alias: "Stop regular wildlife sun check without change"
            value_template: "{{ trigger.id == 'wildlife_sun_check' }}"
        sequence:
          - stop: "Regelmäßiger Wildtierschutz-Check ohne Änderung beendet"
  - variables:
      zone_mod: "{{ active_zone_count | int(6) }}"
      current_zone: "{{ states(zone_tracker) | int(0) }}"
      zone_a: "{{ ((states(zone_tracker) | int(0)) % (active_zone_count | int(6))) + 1 }}"
      zone_b: "{{ ((((states(zone_tracker) | int(0)) % (active_zone_count | int(6))) + 1) % (active_zone_count | int(6))) + 1 }}"
      effective_zones_per_session: "{{ 1 if (active_zone_count | int(6)) <= 1 else (zones_per_session | int(1)) }}"
      zone_a_switch: >
        {% set s = {1: sw1, 2: sw2, 3: sw3, 4: sw4, 5: sw5, 6: sw6} %}
        {{ s[zone_a | int] }}
      zone_b_switch: >
        {% set s = {1: sw1, 2: sw2, 3: sw3, 4: sw4, 5: sw5, 6: sw6} %}
        {{ s[zone_b | int] }}
      zone_a_name: >
        {% set n = {1: z1, 2: z2, 3: z3, 4: z4, 5: z5, 6: z6} %}
        {{ n[zone_a | int] }}
      zone_b_name: >
        {% set n = {1: z1, 2: z2, 3: z3, 4: z4, 5: z5, 6: z6} %}
        {{ n[zone_b | int] }}
      allowed_days: >
        {% if trigger.id == 'session_1' %}{{ days_session_1 }}
        {% elif trigger.id == 'session_2' %}{{ days_session_2 }}
        {% elif trigger.id == 'session_3' %}{{ days_session_3 }}
        {% elif trigger.id == 'session_4' %}{{ days_session_4 }}
        {% else %}['mon','tue','wed','thu','fri','sat','sun']{% endif %}
      today_dow: "{{ now().strftime('%a').lower() }}"
      secs_since_rain: >
        {% set r = states(rain_last_seen) %}
        {% if r not in ['unknown', 'unavailable', 'none', ''] %}
          {{ (as_timestamp(now()) - as_timestamp(r)) | int }}
        {% else %}
          86400
        {% endif %}
      wet_lawn_dry_out_seconds: "{{ wet_lawn_dry_out_delay_hours | int(6) * 3600 }}"
      secs_since_last_run: >
        {% set lr = states(last_run_tracker) %}
        {% set lr_ts = as_timestamp(lr, none) %}
        {% if lr_ts is none %}
          999999999
        {% else %}
          {{ (as_timestamp(now()) - lr_ts) | int }}
        {% endif %}

  - condition: template
    alias: "Skip scheduled session if today is not active; manual starts bypass only this day gate"
    value_template: "{{ trigger.id == 'manual_start' or today_dow in allowed_days }}"

  - choose:
      - conditions:
          - condition: template
            alias: "Skip if garden is currently in use"
            value_template: >
              {% set e = garden_in_use_toggle | string | trim %}
              {{ e | length > 0 and is_state(e, 'on') }}
        sequence:
          - service: notify.persistent_notification
            data:
              title: "🏡 {{ mower_display_name }} Mähvorgang übersprungen — Garten wird genutzt"
              message: >
                {{ trigger.id }} wurde übersprungen, weil der Sperrschalter
                "Garten wird genutzt" aktiv ist.

                Es wurden keine Zonenschalter geändert, keine Mäher-Einstellungen gesetzt
                und der Mäher wurde nicht gestartet.
          - stop: "Garten wird genutzt — Mähvorgang übersprungen"

  - choose:
      - conditions:
          - condition: template
            alias: "Skip if minimum time between mowing runs is still active"
            value_template: >
              {% set min_hours = minimum_time_between_mows | int(0) %}
              {{ min_hours > 0 and (secs_since_last_run | int) < (min_hours * 3600) }}
        sequence:
          - service: notify.persistent_notification
            data:
              title: "⏱️ {{ mower_display_name }} Mähvorgang übersprungen — Mindestabstand"
              message: >
                {{ trigger.id }} wurde übersprungen, weil der konfigurierte Mindestabstand
                zwischen zwei erfolgreichen Mähvorgängen noch nicht erreicht ist.

                Letzter erfolgreicher Mähvorgang: {{ states(last_run_tracker) }}.
                Mindestabstand: {{ minimum_time_between_mows }} Stunden.
                Verbleibende Wartezeit: {{ (((minimum_time_between_mows | int(0) * 3600) - (secs_since_last_run | int)) / 60) | round(0, 'ceil') | int }} Minuten.
          - stop: "Mindestabstand zwischen Mähvorgängen noch aktiv"

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ states(weather_entity) in ['rainy', 'pouring', 'lightning-rainy', 'hail', 'snowy-rainy', 'exceptional'] }}
        sequence:
          - service: input_datetime.set_datetime
            target:
              entity_id: !input rain_last_seen
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - service: notify.persistent_notification
            data:
              title: "🌧️ {{ mower_display_name }} Sitzung übersprungen — Regen"
              message: >
                {{ trigger.id }} übersprungen: Die Wettervorhersage meldet {{ states(weather_entity) }}.
                {% if wet_lawn_dry_out_delay_hours | int(6) > 0 %}
                Nach dem Ende des Regens gilt eine Trocknungszeit von {{ wet_lawn_dry_out_delay_hours }} Stunden.
                {% else %}
                Es ist keine zusätzliche Trocknungszeit nach Regen konfiguriert.
                {% endif %}
          - stop: "Aktuell Regen — Sitzung übersprungen"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ wet_lawn_dry_out_seconds | int > 0 and secs_since_rain | int < wet_lawn_dry_out_seconds | int }}"
        sequence:
          - service: notify.persistent_notification
            data:
              title: "💧 {{ mower_display_name }} Sitzung übersprungen — Trocknungszeit aktiv"
              message: >
                {{ trigger.id }} übersprungen: Der Rasen befindet sich noch in der konfigurierten Trocknungszeit.
                Konfigurierte Trocknungszeit: {{ wet_lawn_dry_out_delay_hours }} Stunden.
                Regen wurde zuletzt vor {{ (secs_since_rain | int / 3600) | round(1) }} Stunden erkannt.
                Es verbleiben {{ (((wet_lawn_dry_out_seconds | int) - (secs_since_rain | int)) / 60) | round(0, 'ceil') | int }} Minuten, bevor wieder gemäht werden darf.
          - stop: "Trocknungszeit aktiv — Sitzung übersprungen"

  - choose:
      - conditions:
          - condition: template
            alias: "Skip if current temperature is too high at session start"
            value_template: >
              {% set temp_entity = temperature_sensor | string | trim %}
              {% if temp_entity | length == 0 %}
                false
              {% else %}
                {% set temp = states(temp_entity) | float(none) %}
                {{ temp is none or temp >= (max_start_temperature | float) }}
              {% endif %}
        sequence:
          - service: notify.persistent_notification
            data:
              title: "🌡️ {{ mower_display_name }} Sitzung übersprungen — Temperatur"
              message: >
                {{ trigger.id }} übersprungen: Die aktuelle Temperatur beträgt
                {{ states(temperature_sensor) if temperature_sensor | string | trim | length > 0 else 'nicht konfiguriert' }} °C.
                Der Mähvorgang startet nur unterhalb von {{ max_start_temperature }} °C.
          - stop: "Temperatur zu hoch oder nicht verfügbar — Sitzung übersprungen"

  - choose:
      - conditions:
          - condition: template
            alias: "Skip if battery level is too low at session start"
            value_template: >
              {% set battery_entity = mower_battery_level_sensor | string | trim %}
              {% if battery_entity | length == 0 %}
                false
              {% else %}
                {% set battery = states(battery_entity) | float(none) %}
                {{ battery is none or battery < (minimum_battery_before_start | float) }}
              {% endif %}
        sequence:
          - service: notify.persistent_notification
            data:
              title: "🔋 {{ mower_display_name }} Sitzung übersprungen — Akkustand"
              message: >
                {{ trigger.id }} wurde übersprungen: Der aktuelle Akkustand beträgt
                {{ states(mower_battery_level_sensor) if mower_battery_level_sensor | string | trim | length > 0 else 'nicht konfiguriert' }} %.
                Erforderlich sind mindestens {{ minimum_battery_before_start }} %.

                Es wurden keine Zonenschalter geändert und der Mäher wurde nicht gestartet.
          - stop: "Akkustand zu niedrig oder nicht verfügbar — Sitzung übersprungen"

  - choose:
      - conditions:
          - condition: template
            alias: "Skip if mower state is not allowed before session start"
            value_template: >
              {% set allowed = allowed_mower_states_before_start if allowed_mower_states_before_start is iterable and allowed_mower_states_before_start is not string else [] %}
              {% set mower_state = states(mower_entity) | lower %}
              {{
                mower_start_state_check_enabled | bool
                and (allowed | list | count > 0)
                and mower_state not in allowed
              }}
        sequence:
          - service: notify.persistent_notification
            data:
              title: "🤖 {{ mower_display_name }} Sitzung übersprungen — Mäherstatus"
              message: >
                {{ trigger.id }} wurde übersprungen: Der aktuelle Mäherstatus ist
                {{ states(mower_entity) }}.

                Erlaubte Statuswerte vor dem Start:
                {{ allowed_mower_states_before_start | join(', ') }}.

                Es wurden keine Zonenschalter geändert und der Mäher wurde nicht gestartet.
          - stop: "Mäherstatus vor Sitzungsstart nicht erlaubt — Sitzung übersprungen"

  - choose:
      - conditions:
          - condition: template
            alias: "Skip if recent low-battery resume condition indicates unfinished task"
            value_template: >
              {% set err_entity = mower_last_error_sensor | string | trim %}
              {% set time_entity = mower_last_error_time_sensor | string | trim %}
              {% set code_entity = mower_last_error_code_sensor | string | trim %}
              {% set charging_entity = mower_charging_binary_sensor | string | trim %}
              {% set activity_entity = mower_activity_mode_sensor | string | trim %}
              {% set err = states(err_entity) | lower if err_entity | length > 0 else '' %}
              {% set code = states(code_entity) | string | trim if code_entity | length > 0 else '' %}
              {% set configured_codes = (low_battery_resume_error_codes | string | replace(' ', '')).split(',') %}
              {% set code_matches = code | length > 0 and code in configured_codes %}
              {% set text_matches = 'battery is too low' in err and 'resume unfinished' in err %}
              {% set raw_time = states(time_entity) if time_entity | length > 0 else '' %}
              {% set err_ts = as_timestamp(raw_time, none) %}
              {% if err_ts is none and err_entity | length > 0 and err_entity in states %}
                {% set err_ts = as_timestamp(states[err_entity].last_changed, none) %}
              {% endif %}
              {% set age = 999999 if err_ts is none else (as_timestamp(now()) - err_ts) | int %}
              {% set mower = states(mower_entity) | lower %}
              {% set charging = charging_entity | length > 0 and is_state(charging_entity, 'on') %}
              {% set activity = states(activity_entity) | upper if activity_entity | length > 0 else '' %}
              {% set waiting_state = mower in ['charging', 'paused', 'returning', 'error'] or charging or activity in ['MODE_CHARGING','MODE_PAUSED','MODE_PAUSE','MODE_RETURNING','MODE_ERROR'] %}
              {{ (text_matches or code_matches) and waiting_state and age < (resume_error_guard_hours | int(6) * 3600) }}
        sequence:
          - service: notify.persistent_notification
            data:
              title: "🔋 {{ mower_display_name }} Sitzung übersprungen — vorherige Aufgabe könnte fortgesetzt werden"
              message: >
                {{ trigger.id }} wurde vor dem Umschalten der Flächenschalter übersprungen, weil eine aktuelle
                Low-Battery-/Unfinished-Task-Resume-Bedingung erkannt wurde.

                Mäherstatus: {{ states(mower_entity) }}
                Lädt: {{ states(mower_charging_binary_sensor) if mower_charging_binary_sensor | string | trim | length > 0 else 'nicht konfiguriert' }}
                Aktivität: {{ states(mower_activity_mode_sensor) if mower_activity_mode_sensor | string | trim | length > 0 else 'nicht konfiguriert' }}
                Letzter Fehler: {{ states(mower_last_error_sensor) if mower_last_error_sensor | string | trim | length > 0 else 'nicht konfiguriert' }}
                Letzter Fehlercode: {{ states(mower_last_error_code_sensor) if mower_last_error_code_sensor | string | trim | length > 0 else 'nicht konfiguriert' }}
          - stop: "Aktuelle Low-Battery-/Unfinished-Task-Bedingung erkannt"

  - choose:
      - conditions:
          - condition: template
            alias: "Skip if any active zone switch is missing"
            value_template: >
              {% set switches = [sw1, sw2, sw3, sw4, sw5, sw6] %}
              {% set active = switches[:zone_mod | int(6)] %}
              {{ active | map('string') | map('trim') | select('eq', '') | list | count > 0 }}
        sequence:
          - service: notify.persistent_notification
            data:
              title: "⚠️ {{ mower_display_name }} Sitzung übersprungen — Zonenschalter fehlt"
              message: >
                Active Zone Count ist {{ zone_mod }}, aber mindestens ein Zonenschalter
                innerhalb dieses aktiven Bereichs ist nicht konfiguriert.
          - stop: "Ein oder mehrere aktive Zonenschalter fehlen"

  - choose:
      - conditions:
          - condition: template
            alias: "Stop before mower actions when Dry-Run/Test Mode is enabled"
            value_template: "{{ dry_run_mode | bool }}"
        sequence:
          - service: notify.persistent_notification
            data:
              title: "🧪 {{ mower_display_name }} Dry-Run — Startbedingungen erfüllt"
              message: >
                Dry-Run/Testmodus ist aktiv. Der Scheduler hätte jetzt einen Mähvorgang gestartet,
                führt aber keine Änderungen aus.

                Auslöser: {{ trigger.id }}.
                Mäherstatus: {{ states(mower_entity) }}.
                Erlaubte Startstatuswerte: {{ allowed_mower_states_before_start | join(', ') if mower_start_state_check_enabled | bool else 'Prüfung deaktiviert' }}.
                Zonenzähler steht auf {{ current_zone }}.
                Geplante Zone A: {{ zone_a_name }} (Zone {{ zone_a }}).
                {% if effective_zones_per_session | int >= 2 %}Geplante Zone B: {{ zone_b_name }} (Zone {{ zone_b }}).{% else %}Zone B ist für diese Sitzung nicht geplant.{% endif %}

                Wettervorhersage: {{ states(weather_entity) }}.
                Temperatur: {{ states(temperature_sensor) if temperature_sensor | string | trim | length > 0 else 'nicht konfiguriert' }} °C.
                Maximale Starttemperatur: {{ max_start_temperature }} °C.
                Schnitthöhe: {% set temp_entity = temperature_sensor | string | trim %}{% set temp = states(temp_entity) | float(none) if temp_entity | length > 0 else none %}{% if hot_weather_blade_height_enabled | bool and temp is not none and temp >= (hot_weather_blade_height_temperature | float) %}{{ mammotion_hot_weather_blade_height }} mm (Hitze-Schnitthöhe aktiv ab {{ hot_weather_blade_height_temperature }} °C){% else %}{{ mammotion_blade_height }} mm{% endif %}.
                Akkustand: {{ states(mower_battery_level_sensor) if mower_battery_level_sensor | string | trim | length > 0 else 'nicht konfiguriert' }} %.
                Mindest-Akkustand vor Start: {{ minimum_battery_before_start }} %.
                Mindestabstand zwischen Mähvorgängen: {{ minimum_time_between_mows }} Stunden.

                Es wurden keine Zonenschalter geändert, keine Mäher-Einstellungen gesetzt,
                kein Mähvorgang gestartet und der Last-Run-Helper wurde nicht aktualisiert.
          - stop: "Dry-Run/Testmodus aktiv — keine Mäheraktionen ausgeführt"

  - service: notify.persistent_notification
    data:
      title: "🌿 {{ mower_display_name }} startet — {{ trigger.id }}"
      message: >
        Zonenzähler steht auf {{ current_zone }}, gemäht wird {{ zone_a_name }} (Zone {{ zone_a }})
        {% if effective_zones_per_session | int >= 2 %}, danach {{ zone_b_name }} (Zone {{ zone_b }}){% endif %}.
        Wettervorhersage: {{ states(weather_entity) }}.
        Temperatur: {{ states(temperature_sensor) if temperature_sensor | string | trim | length > 0 else 'nicht konfiguriert' }} °C.
        Maximale Starttemperatur: {{ max_start_temperature }} °C.
        Schnitthöhe: {% set temp_entity = temperature_sensor | string | trim %}{% set temp = states(temp_entity) | float(none) if temp_entity | length > 0 else none %}{% if hot_weather_blade_height_enabled | bool and temp is not none and temp >= (hot_weather_blade_height_temperature | float) %}{{ mammotion_hot_weather_blade_height }} mm (Hitze-Schnitthöhe aktiv ab {{ hot_weather_blade_height_temperature }} °C){% else %}{{ mammotion_blade_height }} mm{% endif %}.
        Akkustand: {{ states(mower_battery_level_sensor) if mower_battery_level_sensor | string | trim | length > 0 else 'nicht konfiguriert' }} %.
        Mindest-Akkustand vor Start: {{ minimum_battery_before_start }} %.

  - alias: "Turn off all active area switches before Zone A"
    service: switch.turn_off
    target:
      entity_id: >
        {{ [sw1, sw2, sw3, sw4, sw5, sw6][:zone_mod | int(6)] | reject('eq', '') | list }}

  - delay:
      seconds: 6

  - alias: "Enable only Zone A switch"
    service: switch.turn_on
    target:
      entity_id: "{{ zone_a_switch }}"

  - delay:
      seconds: 9

  # ── Apply Mammotion integration settings before Zone A only if needed ────────────
  - alias: "Set blade height before Zone A"
    choose:
      - conditions:
          - condition: template
            value_template: >
              {% set e = blade_height_number_entity | string | trim %}
              {% set current = states(e) | float(none) if e | length > 0 else none %}
              {% set temp_entity = temperature_sensor | string | trim %}
              {% set temp = states(temp_entity) | float(none) if temp_entity | length > 0 else none %}
              {% if hot_weather_blade_height_enabled | bool and temp is not none and temp >= (hot_weather_blade_height_temperature | float) %}
                {% set desired = mammotion_hot_weather_blade_height | float %}
              {% else %}
                {% set desired = mammotion_blade_height | float %}
              {% endif %}
              {{ e | length > 0 and (current is none or (current - desired) | abs > 0.001) }}
        sequence:
          - service: number.set_value
            target:
              entity_id: "{{ blade_height_number_entity }}"
            data:
              value: >
                {% set temp_entity = temperature_sensor | string | trim %}
                {% set temp = states(temp_entity) | float(none) if temp_entity | length > 0 else none %}
                {% if hot_weather_blade_height_enabled | bool and temp is not none and temp >= (hot_weather_blade_height_temperature | float) %}
                  {{ mammotion_hot_weather_blade_height | int }}
                {% else %}
                  {{ mammotion_blade_height | int }}
                {% endif %}
            continue_on_error: true
  - alias: "Set working speed before Zone A"
    choose:
      - conditions:
          - condition: template
            value_template: >
              {% set e = working_speed_number_entity | string | trim %}
              {% set current = states(e) | float(none) if e | length > 0 else none %}
              {% set desired = mammotion_working_speed | float %}
              {{ e | length > 0 and (current is none or (current - desired) | abs > 0.001) }}
        sequence:
          - service: number.set_value
            target:
              entity_id: "{{ working_speed_number_entity }}"
            data:
              value: "{{ mammotion_working_speed | float }}"
            continue_on_error: true
  - alias: "Set cutting path angle before Zone A"
    choose:
      - conditions:
          - condition: template
            value_template: >
              {% set e = cutting_path_angle_number_entity | string | trim %}
              {% set current = states(e) | float(none) if e | length > 0 else none %}
              {% set desired = mammotion_cutting_path_angle | float %}
              {{ e | length > 0 and (current is none or (current - desired) | abs > 0.001) }}
        sequence:
          - service: number.set_value
            target:
              entity_id: "{{ cutting_path_angle_number_entity }}"
            data:
              value: "{{ mammotion_cutting_path_angle | int }}"
            continue_on_error: true
  - alias: "Set crossing angle before Zone A"
    choose:
      - conditions:
          - condition: template
            value_template: >
              {% set e = crossing_angle_number_entity | string | trim %}
              {% set current = states(e) | float(none) if e | length > 0 else none %}
              {% set desired = mammotion_crossing_angle | float %}
              {{ e | length > 0 and (current is none or (current - desired) | abs > 0.001) }}
        sequence:
          - service: number.set_value
            target:
              entity_id: "{{ crossing_angle_number_entity }}"
            data:
              value: "{{ mammotion_crossing_angle | int }}"
            continue_on_error: true
  - alias: "Set path spacing before Zone A"
    choose:
      - conditions:
          - condition: template
            value_template: >
              {% set e = path_spacing_number_entity | string | trim %}
              {% set current = states(e) | float(none) if e | length > 0 else none %}
              {% set desired = mammotion_path_spacing | float %}
              {{ e | length > 0 and (current is none or (current - desired) | abs > 0.001) }}
        sequence:
          - service: number.set_value
            target:
              entity_id: "{{ path_spacing_number_entity }}"
            data:
              value: "{{ mammotion_path_spacing | int }}"
            continue_on_error: true
  - alias: "Set start progress before Zone A"
    choose:
      - conditions:
